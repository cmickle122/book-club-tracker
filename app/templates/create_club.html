{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h2 class="mb-3">Create New Book Club</h2>
          <p class="text-muted">You will automatically become admin and member.</p>

          {% with messages = get_flashed_messages() %}
            {% if messages %}
              {% for m in messages %}
                <div class="alert alert-warning">{{ m }}</div>
              {% endfor %}
            {% endif %}
          {% endwith %}

          <form method="POST" action="{{ url_for('auth.create_club') }}">
            <div class="mb-3">
              <label class="form-label">Club Name *</label>
              <input name="name" class="form-control" placeholder="e.g. Sci-Fi Sundays" required>
            </div>

            <div class="mb-3">
              <label class="form-label">Description</label>
              <textarea name="description" class="form-control" rows="3" placeholder="What do you read?"></textarea>
            </div>

            <div class="mb-3">
              <label class="form-label">Genre</label>
              <input name="genre" class="form-control" placeholder="e.g. Fiction, Mystery, Sci-Fi">
            </div>

            <div class="form-check mb-3">
              <input type="checkbox" name="is_private" class="form-check-input" id="privCheck" onchange="document.getElementById('passcodeField').style.display=this.checked?'block':'none'">
              <label for="privCheck" class="form-check-label">Private Club (requires passcode to join)</label>
            </div>

            <div class="mb-4" id="passcodeField" style="display:none;">
              <label class="form-label">Passcode</label>
              <input name="passcode" type="text" class="form-control" placeholder="Set a passcode for private club">
            </div>

            <button type="submit" class="btn btn-success w-100">Create Club</button>
            <a href="{{ url_for('auth.dashboard') }}" class="btn btn-outline-secondary w-100 mt-2">Cancel</a>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
